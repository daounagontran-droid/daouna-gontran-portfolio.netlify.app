name: MikroTik Manager — APK Android

on:
  push:
    paths:
      - 'mikrotik-app/**'
      - '.github/workflows/mikrotik-app.yml'
  workflow_dispatch:

concurrency:
  group: mikrotik-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mikrotik-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mikrotik-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - name: Compiler l'APK
        working-directory: mikrotik-app/android
        # Téléphones uniquement (ARM) : APK plus léger et compilation plus rapide.
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk MikroTik-Manager.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MikroTik-Manager-APK
          path: mikrotik-app/MikroTik-Manager.apk
          retention-days: 90
