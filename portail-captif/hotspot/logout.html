<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="-1">
<meta name="theme-color" content="#0b1f3a">
<title>DAOUNA Wi-Fi · Déconnecté</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="center">
  <div class="box">
    <div class="brand">
      <div class="brand-mark"><svg class="i" viewBox="0 0 24 24"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><path d="M12 20h.01"/></svg></div>
      <div><div class="brand-name">DAOUNA <b>Wi-Fi</b></div><div class="brand-sub">DAOUNA-WIFI</div></div>
    </div>
    <div class="ticket">
      <div class="ticket-head">
        <div class="badge-ico info"><svg class="i" viewBox="0 0 24 24"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><path d="M12 2v10"/></svg></div>
        <h2>Vous êtes déconnecté</h2>
        <p>Merci d'avoir utilisé DAOUNA Wi-Fi.</p>
      </div>
      <div class="perfo"></div>
      <div class="ticket-body">
        <table class="rows">
          <tr><td>Identifiant</td><td>$(username)</td></tr>
          <tr><td>Durée de la session</td><td>$(uptime)</td></tr>
          <tr><td>Données reçues</td><td>$(bytes-out-nice)</td></tr>
          <tr><td>Données envoyées</td><td>$(bytes-in-nice)</td></tr>
          $(if session-time-left)<tr><td>Temps restant sur le ticket</td><td>$(session-time-left)</td></tr>$(endif)
        </table>
        <a class="btn btn-primary" href="$(link-login)">Se reconnecter</a>
      </div>
    </div>
  </div>
</main>
</body>
</html>
