<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="-1">
<meta name="theme-color" content="#0a1830">
<link rel="stylesheet" href="style.css">
<title>DAOUNA Wi-Fi · Déconnecté</title>
</head>
<body>
<main class="wrap">
  <div class="state off"><svg viewBox="0 0 24 24"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><path d="M12 2v10"/></svg></div>
  <h1>Vous êtes déconnecté</h1>
  <p class="lead">Merci et à bientôt sur DAOUNA Wi-Fi.</p>
  <div class="rows">
    <div><span>Durée</span><b>$(uptime)</b></div>
    <div><span>Données utilisées</span><b>$(bytes-out-nice)</b></div>
    $(if session-time-left)<div><span>Reste sur le ticket</span><b>$(session-time-left)</b></div>$(endif)
  </div>
  <a class="btn" href="$(link-login)">Se reconnecter</a>
</main>
</body>
</html>
