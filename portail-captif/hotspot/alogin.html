<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="-1">
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="style.css">
<title>DAOUNA Wi-Fi · Connecté</title>
</head>
<body onload="setTimeout(function () { location.href = unescape('$(link-redirect-esc)'); }, 2500)">
<main class="wrap">
  <div class="state ok"><svg viewBox="0 0 24 24"><path d="M5 12.5 10 17.5 19.5 7"/></svg></div>
  <h1>Vous êtes connecté</h1>
  <p class="lead">Bonne navigation !</p>
  $(if session-time-left)<p class="big">$(session-time-left)</p><p class="big-label">temps restant</p>$(endif)
  <div class="bar"><span></span></div>
  <p class="foot"><a href="$(link-redirect)">Continuer</a> · <a href="$(link-status)">Mon temps restant</a></p>
</main>
</body>
</html>
