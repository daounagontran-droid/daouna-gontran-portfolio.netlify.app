<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="2; url=$(link-orig)">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="-1">
<title>Publicité</title>
<script>
var popup = '';
function openOrig(){ if(window.focus) popup.focus(); location.href = unescape('$(link-orig-esc)'); }
function openAd(){ location.href = unescape('$(link-redirect-esc)'); }
function openAdvert(){
  if (window.name != 'hotspot_advert') {
    popup = open('$(link-redirect)', 'hotspot_advert', '');
    setTimeout("openOrig()", 1000); return;
  }
  setTimeout("openAd()", 1000);
}
</script>
</head>
<body onLoad="openAdvert()"><p style="font-family:sans-serif;text-align:center;padding:20px;">Patientez...</p></body>
</html>
