<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="-1">
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="style.css">
<title>DAOUNA Wi-Fi</title>
</head>
<body>
<!--
  PERSONNALISATION : nom du réseau (DAOUNA Wi-Fi), tarifs (bloc "plans"),
  téléphone (bas de page). Couleurs : variables en haut de style.css.
-->
$(if chap-id)
<form name="sendin" action="$(link-login-only)" method="post" style="display:none">
  <input type="hidden" name="username">
  <input type="hidden" name="password">
  <input type="hidden" name="dst" value="$(link-orig)">
  <input type="hidden" name="popup" value="true">
</form>
<script src="md5.js"></script>
<script>var CHAP_ID = '$(chap-id)', CHAP_CHALLENGE = '$(chap-challenge)';</script>
$(endif)

<main class="wrap">
  <div class="logo"><svg viewBox="0 0 64 64" role="img" aria-label="Logo DAOUNA Wi-Fi"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient></defs><rect width="64" height="64" rx="18" fill="url(#lg)"/><g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round"><path d="M19 15h11a17 17 0 0 1 0 34H19Z" stroke-width="4.5"/><path class="arc" d="M30.5 27.2a6.5 6.5 0 0 1 0 9.6" stroke-width="3.2"/><path class="arc" d="M34.6 22.6a13 13 0 0 1 0 18.8" stroke-width="3.2"/></g><circle cx="26.5" cy="32" r="2.8" fill="#fff"/></svg></div>
  <h1>DAOUNA <span>Wi-Fi</span></h1>
  <p class="lead" id="lead">Entrez le code de votre ticket</p>

  $(if error)<p class="alert" role="alert">$(error)</p>$(endif)

  <form name="login" action="$(link-login-only)" method="post" autocomplete="off">
    <input type="hidden" name="dst" value="$(link-orig)">
    <input type="hidden" name="popup" value="true">
    <input type="hidden" name="username">
    <input type="hidden" name="password">

    <input class="input code" id="code" type="text" autocapitalize="characters" spellcheck="false" placeholder="••••••" aria-label="Code du ticket" value="$(username)">
    <input class="input" id="user" type="text" autocapitalize="off" spellcheck="false" placeholder="Identifiant" aria-label="Identifiant" value="$(username)" hidden>
    <input class="input" id="pass" type="password" placeholder="Mot de passe" aria-label="Mot de passe" hidden>

    <button class="btn" type="submit" id="go">Se connecter</button>
    <button class="link-btn" type="button" id="switch">J'ai un identifiant et un mot de passe</button>
  </form>

  $(if trial == 'yes')<a class="link-btn" href="$(link-login-only)?dst=$(link-orig-esc)&amp;username=T-$(mac-esc)">Essai gratuit</a>$(endif)

  <div class="plans">
    <div><b>200 F</b>1 heure</div>
    <div><b>500 F</b>24 heures</div>
    <div><b>2 500 F</b>7 jours</div>
  </div>

  <p class="foot">Tickets : <a href="tel:+23560335886">60 33 58 86</a></p>
</main>

<div class="loader" id="loader" role="status">
  <div class="logo"><svg viewBox="0 0 64 64" role="img" aria-label="Logo DAOUNA Wi-Fi"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient></defs><rect width="64" height="64" rx="18" fill="url(#lg)"/><g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round"><path d="M19 15h11a17 17 0 0 1 0 34H19Z" stroke-width="4.5"/><path class="arc" d="M30.5 27.2a6.5 6.5 0 0 1 0 9.6" stroke-width="3.2"/><path class="arc" d="M34.6 22.6a13 13 0 0 1 0 18.8" stroke-width="3.2"/></g><circle cx="26.5" cy="32" r="2.8" fill="#fff"/></svg></div>
  <p>Connexion…</p>
</div>

<script>
(function () {
  var form = document.forms.login, code = document.getElementById('code'),
      user = document.getElementById('user'), pass = document.getElementById('pass'),
      lead = document.getElementById('lead'), sw = document.getElementById('switch'), ticket = true;

  sw.onclick = function () {
    ticket = !ticket;
    code.hidden = !ticket; user.hidden = pass.hidden = ticket;
    lead.textContent = ticket ? 'Entrez le code de votre ticket' : 'Entrez votre identifiant';
    sw.textContent = ticket ? "J'ai un identifiant et un mot de passe" : "J'ai un code de ticket";
    (ticket ? code : user).focus();
  };

  code.oninput = function () { code.value = code.value.toUpperCase().replace(/\s+/g, ''); };

  form.onsubmit = function () {
    var u = (ticket ? code.value : user.value).trim(), p = ticket ? u : pass.value;
    if (!u) { (ticket ? code : user).focus(); return false; }
    document.getElementById('go').disabled = true;
    document.getElementById('loader').className = 'loader show';
    setTimeout(function () {
      if (typeof CHAP_ID !== 'undefined' && document.forms.sendin) {
        var s = document.forms.sendin;
        s.username.value = u;
        s.password.value = hexMD5(CHAP_ID + p + CHAP_CHALLENGE);
        s.submit();
      } else {
        form.username.value = u; form.password.value = p; form.submit();
      }
    }, 600);
    return false;
  };
})();
</script>
</body>
</html>
