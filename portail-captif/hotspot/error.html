<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="-1">
<meta name="theme-color" content="#0b1f3a">
<title>DAOUNA Wi-Fi · Erreur</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="center">
  <div class="box">
    <div class="brand">
      <div class="brand-mark"><svg class="i" viewBox="0 0 24 24"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><path d="M12 20h.01"/></svg></div>
      <div><div class="brand-name">DAOUNA <b>Wi-Fi</b></div><div class="brand-sub">DAOUNA-WIFI</div></div>
    </div>
    <div class="ticket">
      <div class="ticket-head">
        <div class="badge-ico err"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg></div>
        <h2>Connexion impossible</h2>
        <p>$(error)</p>
      </div>
      <div class="perfo"></div>
      <div class="ticket-body">
        <a class="btn btn-primary" href="$(link-login)">Réessayer</a>
        <p class="muted-center">Un souci avec votre ticket ? <a href="tel:+23560335886">+235 60 33 58 86</a></p>
      </div>
    </div>
  </div>
</main>
</body>
</html>
